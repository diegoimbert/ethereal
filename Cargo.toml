[workspace]
members = ["crates/ether-protocol", "crates/ether-model", "crates/ether-core", "crates/ether-devices", "crates/ether-media", "crates/ether-controller", "crates/ether-stretch", "crates/ether-clap", "crates/ether-plugin-scanner", "crates/ether-plugin-host", "crates/ether-vst3", "crates/ether-au", "crates/ether-sandbox", "crates/ether-native", "crates/ether-wasm", "crates/ether-server", "apps/desktop/src-tauri", "crates/ether-mcp"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
assert_no_alloc = "1.1"
async-trait = "0.1"
base64 = "0.22"
basedrop = "0.1"
block2 = "0.6"
console_error_panic_hook = "0.1"
cpal = "0.16"
crossbeam-channel = "0.5"
dawproject = "0.11"
flacenc = "0.4"
getrandom = "0.3"
globset = "0.4"
hkdf = "0.12"
hmac = "0.12"
hound = "3.5"
interprocess = "2"
js-sys = "0.3.77"
libloading = "0.8"
midir = "0.10"
objc2 = "0.6"
objc2-audio-toolbox = "0.3"
objc2-avf-audio = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
opus = "0.4"
parking_lot = "0.12"
proptest = "1"
raw-window-handle = "0.6"
raw_sync = "0.1"
realfft = "3.5"
rpp-parser = "0.1.1"
rtrb = "0.3"
rubato = "0.16"
rustfft = "6.4"
rusty_mp3 = "1.0"
semver = "1"
serde-wasm-bindgen = "0.6"
sha1 = "0.10"
sha2 = "0.10"
shared_memory = "0.12"
signal-hook = "0.3"
stun = "0.17"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
thiserror = "2"
toml = "0.9"
triple_buffer = "8"
tungstenite = "0.27"
turn = "0.17"
vst3 = "0.3"
wasm-bindgen = "0.2.100"
webpki-roots = "0.26"
x11-dl = "2.21"

[workspace.dependencies.audiopus_sys]
version = "0.2"
features = ["static"]

[workspace.dependencies.chacha20poly1305]
version = "0.10"
features = ["alloc"]
default-features = false

[workspace.dependencies.clack-extensions]
git = "https://github.com/prokopyl/clack"
rev = "27ca28391b57a61bad4bb5099288a7bf9247350d"
features = ["clack-host", "audio-ports", "gui", "latency", "log", "note-ports", "params", "remote-controls", "state", "timer", "tail"]

[workspace.dependencies.clack-host]
git = "https://github.com/prokopyl/clack"
rev = "27ca28391b57a61bad4bb5099288a7bf9247350d"

[workspace.dependencies.clack-plugin]
git = "https://github.com/prokopyl/clack"
rev = "27ca28391b57a61bad4bb5099288a7bf9247350d"

[workspace.dependencies.ether-au]
path = "crates/ether-au"

[workspace.dependencies.ether-clap]
path = "crates/ether-clap"

[workspace.dependencies.ether-controller]
path = "crates/ether-controller"

[workspace.dependencies.ether-core]
path = "crates/ether-core"

[workspace.dependencies.ether-devices]
path = "crates/ether-devices"

[workspace.dependencies.ether-media]
path = "crates/ether-media"
default-features = false

[workspace.dependencies.ether-model]
path = "crates/ether-model"

[workspace.dependencies.ether-native]
path = "crates/ether-native"

[workspace.dependencies.ether-plugin-host]
path = "crates/ether-plugin-host"

[workspace.dependencies.ether-protocol]
path = "crates/ether-protocol"

[workspace.dependencies.ether-sandbox]
path = "crates/ether-sandbox"

[workspace.dependencies.ether-server]
path = "crates/ether-server"

[workspace.dependencies.ether-stretch]
path = "crates/ether-stretch"
default-features = false

[workspace.dependencies.ether-vst3]
path = "crates/ether-vst3"

[workspace.dependencies.flate2]
version = "1.1"
features = ["rust_backend"]
default-features = false

[workspace.dependencies.insta]
version = "1"
features = ["json"]

[workspace.dependencies.midly]
version = "0.5"
features = ["std"]
default-features = false

[workspace.dependencies.objc2-app-kit]
version = "0.3"
features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication"]
default-features = false

[workspace.dependencies.objc2-foundation]
version = "0.3"
features = ["std", "NSString", "NSGeometry", "NSThread"]
default-features = false

[workspace.dependencies.quick-xml]
version = "0.41"
features = ["serialize"]

[workspace.dependencies.regex]
version = "1.11"
features = ["std", "unicode-case", "unicode-perl"]
default-features = false

[workspace.dependencies.rmcp]
version = "3.5"
features = ["server", "transport-io"]
default-features = false

[workspace.dependencies.rustls]
version = "0.23"
features = ["std", "tls12", "ring"]
default-features = false

[workspace.dependencies.serde]
version = "1.0.219"
features = ["derive", "rc"]

[workspace.dependencies.serde_json]
version = "1.0.140"
features = ["float_roundtrip"]

[workspace.dependencies.str0m]
version = "0.24"
features = ["rust-crypto"]
default-features = false

[workspace.dependencies.symphonia]
version = "0.5"
features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac"]
default-features = false

[workspace.dependencies.tauri]
version = "2"
features = []

[workspace.dependencies.tauri-build]
version = "2"
features = []

[workspace.dependencies.tauri-plugin-http]
version = "2"
default-features = false

[workspace.dependencies.tauri-plugin-single-instance]
version = "2"
features = ["deep-link"]

[workspace.dependencies.tokio]
version = "1"
features = ["rt", "net", "time", "sync"]
default-features = false

[workspace.dependencies.tracing]
version = "0.1"
features = ["std"]
default-features = false

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "fmt"]

[workspace.dependencies.ts-rs]
version = "12"
features = ["serde-compat"]

[workspace.dependencies.ulid]
version = "1.2"
default-features = false

[workspace.dependencies.uuid]
version = "1.18"
features = ["std", "serde"]
default-features = false

[workspace.dependencies.web-sys]
version = "0.3.77"
features = ["console", "MessagePort", "Worker", "AudioWorkletGlobalScope"]

[workspace.dependencies.webrtc-util]
version = "0.17"
features = ["conn"]
default-features = false

[workspace.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"]

[workspace.dependencies.x25519-dalek]
version = "2.0.1"
default-features = false

[workspace.package]
edition = "2024"
version = "0.0.1"
authors = ["Ethereal contributors"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/diegoimbert/ethereal"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package]

[profile.dev]
opt-level = 1
lto = "off"

[profile.dev.package."*"]
opt-level = 2
