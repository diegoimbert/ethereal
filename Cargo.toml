[workspace]
resolver = "3"
members = [
    "crates/ether-protocol",
    "crates/ether-model",
    "crates/ether-core",
    "crates/ether-devices",
    "crates/ether-media",
    "crates/ether-controller",
    "crates/ether-stretch",
    "crates/ether-clap",
    "crates/ether-plugin-scanner",
    "crates/ether-plugin-host",
    "crates/ether-vst3",
    "crates/ether-au",
    "crates/ether-sandbox",
    "crates/ether-native",
    "crates/ether-wasm",
    # Roadmap v2 (contracts-2).
    "crates/ether-server",
    "apps/desktop/src-tauri",
    # agent-api (owner request): MCP server.
    "crates/ether-mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/diegoimbert/ethereal"
authors = ["Ethereal contributors"]
license = "AGPL-3.0-or-later"
publish = false

# The versions of the dependencies this workspace's crates use. Crates opt in with
# `foo.workspace = true` in their own Cargo.toml; add an entry here with its first user.
[workspace.dependencies]
# --- internal ---
ether-protocol = { path = "crates/ether-protocol" }
ether-model = { path = "crates/ether-model" }
ether-core = { path = "crates/ether-core" }
ether-devices = { path = "crates/ether-devices" }
ether-media = { path = "crates/ether-media", default-features = false }
ether-controller = { path = "crates/ether-controller" }
ether-stretch = { path = "crates/ether-stretch", default-features = false }
ether-clap = { path = "crates/ether-clap" }
ether-plugin-host = { path = "crates/ether-plugin-host" }
ether-vst3 = { path = "crates/ether-vst3" }
ether-au = { path = "crates/ether-au" }
ether-sandbox = { path = "crates/ether-sandbox" }
ether-native = { path = "crates/ether-native" }
ether-server = { path = "crates/ether-server" }

# --- serialization / ids / types ---
serde = { version = "1.0.219", features = ["derive", "rc"] }
# float_roundtrip: exact f64 parse (beats, bpm, automation values must survive save/load and the wire).
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
ulid = { version = "3.0", default-features = false }
# ProjectId is a UUIDv7. No `v7` feature here: it pulls in `getrandom` (breaks the wasm
# check); the model builds v7 UUIDs from injected time + entropy (`IdGen::next_project_id`).
# Native-only crates may add `features = ["v7"]` to use `Uuid::now_v7()`.
uuid = { version = "1.18", default-features = false, features = ["std", "serde"] }
ts-rs = { version = "12", features = ["serde-compat"] }
base64 = "0.22"

# --- errors / logging ---
thiserror = "2"
# base-145: library file filters (small build: no perf/unicode tables beyond case + perl classes).
regex = { version = "1.11", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- real-time plumbing ---
rtrb = "0.4"
assert_no_alloc = "1.1"
crossbeam-channel = "0.5"

# --- audio I/O, media, DSP ---
cpal = "0.16"
midir = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis", "isomp4", "aac", "alac"] }
rubato = "0.16"
# #717: Standard MIDI File import/export (no rayon: wasm-safe).
midly = { version = "0.5", default-features = false, features = ["std"] }
realfft = "3.5"
rustfft = "6.4"

# --- plugins (CLAP via clack; git-only, pinned) ---
clack-host = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", features = ["clack-host", "audio-ports", "gui", "latency", "log", "note-ports", "params", "remote-controls", "state", "timer", "tail"] }
clack-plugin = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d" }
libloading = "0.9"

# --- plugins: VST3 + AU (formats-base; used by ether-vst3 / ether-au). All permissive. ---
# VST3 COM bindings, host and plugin side, pre-generated from the (MIT-licensed, since 3.8)
# VST3 SDK headers; no SDK or bindgen needed at build time.
# Plugin-side test fixtures can be written with it too (`ComWrapper`, see its `gain` example).
vst3 = "0.3"
# Apple framework bindings for AU hosting (macOS only; same objc2 0.6 family as tauri/the
# app). Default features = every framework item;
# implementers may trim them.
objc2-audio-toolbox = "0.3"
objc2-core-audio-types = "0.3"
objc2-avf-audio = "0.3"
objc2-core-foundation = "0.3"
# Objective-C blocks (AU/AVAudioUnit completion handlers).
block2 = "0.6"

# --- out-of-process sandbox / IPC ---
shared_memory = "0.12"

# --- wasm ---
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console", "MessagePort", "Worker", "AudioWorkletGlobalScope"] }
console_error_panic_hook = "0.1"
getrandom = "0.4"

# --- desktop app ---
tauri = { version = "2", features = [] }
# The main window's native handle for plugin editor ownership (ether-plugin-host `editor_owner`). Already in the lockfile via tauri.
raw-window-handle = "0.6"
# macOS AppKit bindings (CLAP embedded editors in floating host windows). Already in the lockfile via tauri.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSThread"] }
# Win32 bindings (VST3 embedded editors in host windows on Windows). Already in the lockfile via tauri.
# Xlib loaded at runtime (Linux plugin editor host windows, `ether-plugin-host`).
x11-dl = "2.21"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", default-features = false }

# --- engine server, export ---
# remote-engine: WebSocket server (sync, no async runtime).
tungstenite = "0.27"
# remote-engine: SIGTERM/SIGINT save the project and close clients.
signal-hook = "0.4"
# export: WAV/FLAC/MP3 writing.
hound = "3.5"
flacenc = "0.4"
# Pure-Rust MP3 encoder (no C, builds for wasm32): MP3 exports.
rusty_mp3 = "1.0"

# --- agent-api: MCP server (official Rust SDK; stdio transport) and its async runtime. ---
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }

# --- tooling / tests ---
proptest = "1"

[profile.dev]
# DSP code is unusably slow at opt-level 0; keep debuginfo but optimize a bit.
opt-level = 1
# No local ThinLTO across codegen units: with opt-level > 0 and incremental builds, it can leave
# references to `_anon.<hash>.llvm.<n>` symbols that a later incremental rebuild no longer emits
# ("linking with `cc` failed: Undefined symbols"). "off" (not `false`) disables it.
lto = "off"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
# `todo!()` stubs are intentional in the foundation scaffold; nodes remove them.
todo = "allow"
# Stubs hide their future internals behind a private `_private: ()` field.
manual_non_exhaustive = "allow"
