[workspace]
resolver = "3"
# The member list is owned by `foundation` and frozen: nobody else edits it (ORCHESTRATION.md §4).
members = [
    "crates/ether-protocol",
    "crates/ether-model",
    "crates/ether-core",
    "crates/ether-devices",
    "crates/ether-media",
    "crates/ether-controller",
    "crates/ether-stretch",
    "crates/ether-clap",
    "crates/ether-plugin-scanner",
    "crates/ether-plugin-host",
    "crates/ether-vst3",
    "crates/ether-au",
    "crates/ether-sandbox",
    "crates/ether-native",
    "crates/ether-wasm",
    # Roadmap v2 (contracts-2).
    "crates/ether-server",
    "crates/ether-collab",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/diegoimbert/ethereal"
authors = ["Ethereal contributors"]
publish = false

# Every dependency any node is expected to need is pre-declared here (ORCHESTRATION.md §4).
# Crates opt in with `foo.workspace = true` in their OWN Cargo.toml. A dependency missing
# from this table goes through a BCR. Entries that no crate uses yet are not resolved or
# downloaded, so pre-declaring them is free.
[workspace.dependencies]
# --- internal ---
ether-protocol = { path = "crates/ether-protocol" }
ether-model = { path = "crates/ether-model" }
ether-core = { path = "crates/ether-core" }
ether-devices = { path = "crates/ether-devices" }
ether-media = { path = "crates/ether-media", default-features = false }
ether-controller = { path = "crates/ether-controller" }
ether-stretch = { path = "crates/ether-stretch", default-features = false }
ether-clap = { path = "crates/ether-clap" }
ether-plugin-host = { path = "crates/ether-plugin-host" }
ether-vst3 = { path = "crates/ether-vst3" }
ether-au = { path = "crates/ether-au" }
ether-sandbox = { path = "crates/ether-sandbox" }
ether-native = { path = "crates/ether-native" }
ether-server = { path = "crates/ether-server" }
ether-collab = { path = "crates/ether-collab" }

# --- serialization / ids / types ---
serde = { version = "1.0.219", features = ["derive", "rc"] }
# float_roundtrip: exact f64 parse (beats, bpm, automation values must survive save/load and the wire).
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
ulid = { version = "1.2", default-features = false }
# ProjectId is a UUIDv7. No `v7` feature here: it pulls in `getrandom` (breaks the wasm
# check); the model builds v7 UUIDs from injected time + entropy (`IdGen::next_project_id`).
# Native-only crates may add `features = ["v7"]` to use `Uuid::now_v7()`.
uuid = { version = "1.18", default-features = false, features = ["std", "serde"] }
ts-rs = { version = "12", features = ["serde-compat"] }
base64 = "0.22"
toml = "0.9"

# --- errors / logging ---
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- real-time plumbing ---
rtrb = "0.3"
triple_buffer = "8"
basedrop = "0.1"
assert_no_alloc = "1.1"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# --- audio I/O, media, DSP ---
cpal = "0.16"
midir = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "aiff", "flac", "mp3", "ogg", "vorbis"] }
rubato = "0.16"
signalsmith-stretch = "0.1"

# --- plugins (CLAP via clack; git-only, pinned) ---
clack-host = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", features = ["clack-host", "audio-ports", "gui", "latency", "log", "note-ports", "params", "state", "timer", "tail"] }
clack-plugin = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d" }
libloading = "0.8"

# --- plugins: VST3 + AU (formats-base; used by ether-vst3 / ether-au). All GPL-3-compatible. ---
# VST3 COM bindings, host and plugin side, pre-generated from the (MIT-licensed, since 3.8)
# VST3 SDK headers; no SDK or bindgen needed at build time. License: MIT OR Apache-2.0.
# Plugin-side test fixtures can be written with it too (`ComWrapper`, see its `gain` example).
vst3 = "0.3"
# Apple framework bindings for AU hosting (macOS only; same objc2 0.6 family as tauri/the
# app). License: Zlib OR Apache-2.0 OR MIT. Default features = every framework item;
# implementers may trim them.
objc2-audio-toolbox = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-avf-audio = "0.3"
objc2-core-foundation = "0.3"
# Objective-C blocks (AU/AVAudioUnit completion handlers). License: MIT.
block2 = "0.6"

# --- out-of-process sandbox / IPC ---
shared_memory = "0.12"
raw_sync = "0.1"
interprocess = "2"

# --- wasm ---
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console", "MessagePort", "Worker", "AudioWorkletGlobalScope"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = "0.3"

# --- desktop app ---
tauri = { version = "2", features = [] }
# macOS AppKit bindings (CLAP embedded editors in floating host windows). Already in the lockfile via tauri.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSThread"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# base-115 sharing (docs/SHARING.md §5): `ethereal://` deep links; a second launch hands the
# link to the running instance. License: MIT OR Apache-2.0.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# --- roadmap v2 (contracts-2; versions are checked when a crate first uses them) ---
# remote-engine: WebSocket server (sync, no async runtime).
tungstenite = "0.27"
# export: WAV/FLAC writing.
hound = "3.5"
flacenc = "0.4"

# --- listen-on-peer (stream-host; docs/COLLAB.md §11) ---
# Native WebRTC sender (sans-IO). `rust-crypto`: SRTP and DTLS ciphers in pure Rust, no system
# OpenSSL; its DTLS stack (`dimpl`, default features) still builds the vendored aws-lc
# (aws-lc-sys: cmake, and NASM on Windows). License: MIT OR Apache-2.0.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
# Opus encoder (libopus, BSD-3). `audiopus_sys/static` builds the vendored libopus
# statically (never a system library). Licenses: MIT/Apache-2.0 (opus), ISC (audiopus_sys).
opus = "0.4"
audiopus_sys = { version = "0.2", features = ["static"] }
# Relay STUN codec and optional TURN server (webrtc-rs). License: MIT/Apache-2.0.
stun = "0.17"
turn = "0.17"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"] }
# The `turn` crate's socket trait (`Conn`, via async-trait) for the relay's socket wrappers.
webrtc-util = { version = "0.17", default-features = false, features = ["conn"] }
async-trait = "0.1"
# TURN REST credentials (HMAC-SHA1). License: MIT OR Apache-2.0.
hmac = "0.12"
sha1 = "0.10"
# base-115 sharing: link-key derivations and proofs (HMAC-SHA256), door hashes (docs/SHARING.md §4.2).
sha2 = "0.10"

# --- tooling / tests ---
globset = "0.4"
proptest = "1"
insta = { version = "1", features = ["json"] }

[profile.dev]
# DSP code is unusably slow at opt-level 0; keep debuginfo but optimize a bit.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
# `todo!()` stubs are intentional in the foundation scaffold; nodes remove them.
todo = "allow"
# Stubs hide their future internals behind a private `_private: ()` field.
manual_non_exhaustive = "allow"
