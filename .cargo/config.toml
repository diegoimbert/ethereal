[env]
# CMake 4 removed compatibility with projects declaring cmake_minimum_required < 3.5. The Opus
# source bundled in audiopus_sys (stream-host's WebRTC audio) still declares an older minimum, so
# its CMake build fails on CMake 4 (release CI on macOS/Windows, and local macOS with Homebrew CMake).
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

# ScreenCaptureKit (plugin editor window capture, `ether-plugin-host` `capture`) exists from
# macOS 12.3: weak-link it so every binary that links ether-plugin-host (the app, the sandbox
# helper, the scanner) still starts on older macOS, where capture reports "unsupported"
# (it checks for the `SCStream` class first). Overridden by a `RUSTFLAGS` environment variable.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-weak_framework,ScreenCaptureKit"]

# WebAssembly SIMD (128-bit) for the browser engine: LLVM vectorizes the DSP loops (mixing,
# gains, filters, meters). Every browser the web host supports has it (Chrome 91, Firefox 89,
# Safari 16.4); the host already needs SharedArrayBuffer and AudioWorklet.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# Native x86-64 builds target x86-64-v2 (SSE4.2, SSSE3, POPCNT: every x86-64 CPU since 2009;
# Windows 11 24H2 requires it): the DSP gets SSE4.1 rounding and blends instead of library
# calls and scalar fallbacks. Overridden by a `RUSTFLAGS` environment variable.
# Its features, not `target-cpu=x86-64-v2`: rustc 1.99.1 on Windows panics with that
# (`global_llvm_features` unwrap in `run_thin_lto`) building `ether-stretch`'s build script in
# the full product (`just full-desktop`).
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+cmpxchg16b"]
