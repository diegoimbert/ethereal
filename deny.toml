# cargo-deny: license, advisory, ban and source policy for the dependency tree
# (`just check-licenses`, `just check-advisories`, CI).
#
# Ethereal ships desktop installers and a web build, so every dependency is distributed.
# Everything allowed here is permissive (MPL-2.0 is file-level copyleft and is fine to link,
# but it is listed explicitly rather than lumped in with the permissive licenses).
#
# Ethereal itself is AGPL-3.0-or-later and is also offered under commercial terms
# (LICENSING.md). A dependency that is itself copyleft (AGPL/GPL) could not be relicensed, so
# it must not come in: keep this allow-list permissive, plus licenses that are compatible with
# the AGPL and with relicensing. THIRD-PARTY-NOTICES.md is generated separately
# (scripts/gen-notices.mjs) and is what the artifacts carry; this file is the gate that keeps
# a new, unexpected license out.
#
# Refresh the allow-list only after checking the license really is acceptable to ship and to
# relicense.

[graph]
all-features = true

# Security advisories (RustSec). CI gates a pull request on them when it changes Cargo.lock,
# and checks `main` on every push and daily, so a new advisory against an existing dependency
# shows up without blocking unrelated pull requests (.github/workflows/ci.yml, `advisories`).
[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are flagged only when the workspace depends on them directly; deep
# transitive ones (proc-macro-error, unic-* under tauri/gtk) have no replacement we control.
unmaintained = "workspace"

[bans]
# Duplicate versions are unavoidable with tauri/gtk/windows-rs; not a policy question.
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own `path` dependencies carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# clack (CLAP hosting) comes from git at a pinned rev (crates/ether-clap).
allow-git = ["https://github.com/prokopyl/clack"]

[licenses]
version = 2
# Confidence needed when cargo-deny has to guess a license from LICENSE file text.
confidence-threshold = 0.8
# The workspace's own crates (`publish = false`) are not third-party; their license is a
# separate question from the dependencies' (see THIRD-PARTY-NOTICES.md for the latter).
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
