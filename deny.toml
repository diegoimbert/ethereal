# cargo-deny: license policy for the dependency tree (`just check-licenses`, CI).
#
# Ethereal ships desktop installers and a web build, so every dependency is distributed.
# Everything allowed here is permissive (MPL-2.0 is file-level copyleft and is fine to link,
# but it is listed explicitly rather than lumped in with the permissive licenses).
# THIRD-PARTY-NOTICES.md is generated separately (scripts/gen-notices.mjs) and is what the
# artifacts carry; this file is the gate that keeps a new, unexpected license out.
#
# Refresh the allow-list only after checking the license really is acceptable to ship.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Confidence needed when cargo-deny has to guess a license from LICENSE file text.
confidence-threshold = 0.8
# The workspace's own crates (`publish = false`) are not third-party; their license is a
# separate question from the dependencies' (see THIRD-PARTY-NOTICES.md for the latter).
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
