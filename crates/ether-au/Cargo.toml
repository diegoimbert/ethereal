[package]
name = "ether-au"
description = "Audio Unit hosting (PluginFormatHost over the macOS AudioComponent registry). Owned by the `au` node."

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-core]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-plugin-host]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.assert_no_alloc]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]

[target.'cfg(target_os = "macos")'.dependencies.block2]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
workspace = true
features = ["NSViewController", "NSView", "NSWindow", "NSResponder"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-audio-toolbox]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-avf-audio]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-audio-types]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
workspace = true
features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSPropertyList", "NSString", "NSValue", "NSObject", "NSGeometry"]

[target.'cfg(target_os = "macos")'.dependencies.rtrb]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.tracing]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]

[target.'cfg(target_os = "macos")'.build-dependencies]

[[test]]
path = "tests/au.rs"
name = "au"
required-features = []

[[test]]
path = "tests/plugin_sidechain.rs"
name = "plugin_sidechain"
required-features = []

[lib]
path = "src/lib.rs"
name = "ether_au"
required-features = []
crate-type = ["lib"]
