[package]
name = "ether-vst3"
description = "VST3 plugin hosting (PluginFormatHost for .vst3 bundles). Owned by the `vst3` node."

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.assert_no_alloc]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-core]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-plugin-host]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.libloading]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rtrb]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.serde_json]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tracing]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.vst3]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]

[target.'cfg(target_os = "macos")'.dependencies.objc2]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]

[target.'cfg(target_os = "macos")'.build-dependencies]

[target."cfg(windows)".dependencies.windows-sys]
workspace = true

[target."cfg(windows)".dev-dependencies]

[target."cfg(windows)".build-dependencies]

[[test]]
path = "tests/host.rs"
name = "host"
required-features = []

[[test]]
path = "tests/plugin_sidechain.rs"
name = "plugin_sidechain"
required-features = []

[[example]]
path = "examples/ether_vst3_test_plugin.rs"
name = "ether_vst3_test_plugin"
required-features = []
crate-type = ["cdylib"]

[lib]
path = "src/lib.rs"
name = "ether_vst3"
required-features = []
crate-type = ["lib"]
