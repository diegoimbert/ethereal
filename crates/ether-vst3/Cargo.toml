[package]
name = "ether-vst3"
description = "VST3 plugin hosting (PluginFormatHost for .vst3 bundles). Owned by the `vst3` node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ether-core.workspace = true
ether-plugin-host.workspace = true
# VST3 COM bindings (host side here; plugin side in the test fixture). MIT OR Apache-2.0.
vst3.workspace = true
libloading.workspace = true
rtrb.workspace = true
serde_json.workspace = true
tracing.workspace = true

# CFBundle for `bundleEntry`, AppKit host windows for editors.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

# Win32 host windows for editors.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_no_alloc.workspace = true

# Minimal VST3 plugin (a gain effect with a separate controller + a single-component
# instrument) used by the tests of this crate, `ether-plugin-scanner` and `ether-sandbox`.
[[example]]
name = "ether_vst3_test_plugin"
crate-type = ["cdylib"]

[lints]
workspace = true
