[package]
name = "ether-mcp"
description = "MCP server (stdio) exposing Ethereal's agent tools to LLM clients (Claude Code, Claude Desktop, ...)."

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies.ether-controller]
workspace = true

[dependencies.ether-native]
workspace = true

[dependencies.ether-protocol]
workspace = true

[dependencies.ether-server]
workspace = true

[dependencies.getrandom]
workspace = true

[dependencies.rmcp]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tokio]
workspace = true
features = ["rt-multi-thread", "macros", "io-std"]

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.tungstenite]
workspace = true

[features]
default = []
full = ["ether-server/full"]

[[bin]]
path = "src/main.rs"
name = "ether-mcp"
required-features = []

[[test]]
path = "tests/bridge.rs"
name = "bridge"
required-features = []

[[test]]
path = "tests/mcp.rs"
name = "mcp"
required-features = []

[lib]
path = "src/lib.rs"
name = "ether_mcp"
required-features = []
crate-type = ["lib"]
