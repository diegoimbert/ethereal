[package]
name = "ether-wasm"
description = "wasm-bindgen bindings: controller worker + AudioWorklet engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ether-core.workspace = true
ether-controller.workspace = true
ether-devices.workspace = true
ether-media.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
# The share port (`MessagePort`).
web-sys = { workspace = true, features = ["MessagePort"] }
# Complex warp (feature `warp-complex`): the pure-Rust Signalsmith Stretch port.
ether-stretch = { workspace = true, optional = true }

[lints]
workspace = true

# Cargo features (docs/ARCHITECTURE.md "Cargo features"). The web build
# (apps/web/scripts/build-wasm.mjs) uses `full` unless ETHER_WASM_FEATURES says otherwise.
[features]
default = []
full = ["warp-complex"]
# Pitch-preserving Complex warp (`ether-stretch/rust-stretch`, no C++). Off: Complex clips
# play Repitch.
warp-complex = ["dep:ether-stretch", "ether-stretch/rust-stretch"]
# Graph snapshot benchmark (`perf` module, the large fixture and the
# `bench_graph_snapshot` export), for `apps/web/src/engine/graphSnapshot.bench.test.ts`
# and `tests/web_perf.rs`. Not in `full`: the production wasm doesn't ship it. Build it with
# `just bench-wasm` (ETHER_WASM_FEATURES=full,bench).
bench = []

