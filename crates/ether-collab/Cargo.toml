[package]
name = "ether-collab"
description = "Collaboration layer: relay/sequencer, site transports and wire helpers for replicated documents (docs/COLLAB.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Native + wasm (runs next to the controller). The relay (`relay::server`, the
# `ether-collab-relay` binary) and the tungstenite client are native only; the web client
# uses the browser's WebSocket from the controller Worker.
[dependencies]
ether-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# base-115 sharing (`share::keys`, every target): link-key derivations and proofs
# (HMAC-SHA256), door hashes (SHA-256), base64url ids (docs/SHARING.md §4.2).
hmac.workspace = true
sha2.workspace = true
base64.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite.workspace = true
crossbeam-channel.workspace = true
getrandom.workspace = true
tracing-subscriber.workspace = true
# Relay ICE (`relay::ice`, docs/COLLAB.md §10): STUN codec, TURN REST credentials, and the
# optional TURN server (`turn` feature, tokio in its own thread).
stun.workspace = true
sha1.workspace = true
turn = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# The `turn` crate's socket trait (`Conn`, async-trait) for the relay's socket wrappers.
webrtc-util = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Event"] }

[features]
default = []
# In-process TURN server for the relay binary (`--turn`).
turn = ["dep:turn", "dep:tokio", "dep:webrtc-util", "dep:async-trait"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[[bin]]
name = "ether-collab-relay"
path = "src/bin/relay.rs"
