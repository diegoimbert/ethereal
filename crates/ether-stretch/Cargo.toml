[package]
name = "ether-stretch"
description = "Stretcher trait + Signalsmith Stretch implementation (native)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `signalsmith` is on by default so `cargo test --workspace` exercises the binding.
# Dependents use the workspace dep (`default-features = false`) and get the trait only;
# native hosts opt in with `features = ["signalsmith"]`. The dependency is native-only, so
# enabling the feature on wasm32 is a no-op (trait only, no C++).
default = ["signalsmith"]
signalsmith = ["dep:signalsmith-stretch"]

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
signalsmith-stretch = { workspace = true, optional = true }

[lints]
workspace = true
