[package]
name = "ether-stretch"
description = "Stretcher trait + Signalsmith Stretch (C++ native, pure-Rust port) and Complex+."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `signalsmith` is on by default so `cargo test --workspace` exercises the binding.
# Dependents use the workspace dep (`default-features = false`) and get the trait only;
# native hosts opt in with `features = ["signalsmith"]`. The C++ is native-only, so
# enabling the feature on wasm32 is a no-op (trait only, no C++).
default = ["signalsmith", "rust-stretch"]
# Signalsmith Stretch (C++, MIT) is vendored in `csrc/` and built by `build.rs` with a
# small C ABI wrapper (split computation, planar buffers).
signalsmith = []
# Pure-Rust port of Signalsmith Stretch (`src/rust/`) and Complex+ (`src/plus/`): build
# everywhere, including wasm32 (the web host's stretchers).
rust-stretch = ["dep:rustfft", "dep:realfft"]

[dependencies]
rustfft = { workspace = true, optional = true }
realfft = { workspace = true, optional = true }

[dev-dependencies]
assert_no_alloc.workspace = true
rustfft.workspace = true
realfft.workspace = true

[build-dependencies]
cc = "1"

[lints]
workspace = true
