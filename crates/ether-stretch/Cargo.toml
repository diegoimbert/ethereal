[package]
name = "ether-stretch"
build = "build.rs"
description = "Stretcher trait + Signalsmith Stretch implementations (C++ native, pure-Rust port)."

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies.rustfft]
workspace = true
optional = true

[dev-dependencies.assert_no_alloc]
workspace = true

[dev-dependencies.rustfft]
workspace = true

[build-dependencies]
cc = "1"

[features]
default = ["signalsmith", "rust-stretch"]
rust-stretch = ["dep:rustfft"]
signalsmith = []

[lib]
path = "src/lib.rs"
name = "ether_stretch"
required-features = []
crate-type = ["lib"]
