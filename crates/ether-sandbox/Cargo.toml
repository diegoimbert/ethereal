[package]
name = "ether-sandbox"
description = "Out-of-process sandboxed PluginNode + helper binary."

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.base64]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-au]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-clap]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-core]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-plugin-host]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-vst3]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.serde]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.serde_json]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.thiserror]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tracing]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.assert_no_alloc]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]

[target."cfg(unix)".dependencies.shared_memory]
workspace = true

[target."cfg(unix)".dev-dependencies]

[target."cfg(unix)".build-dependencies]

[[bin]]
path = "src/bin/ether-sandbox-helper.rs"
name = "ether-sandbox-helper"
required-features = []

[[test]]
path = "tests/au.rs"
name = "au"
required-features = []

[[test]]
path = "tests/plugin_sidechain.rs"
name = "plugin_sidechain"
required-features = []

[[test]]
path = "tests/sandbox.rs"
name = "sandbox"
required-features = []

[[test]]
path = "tests/vst3.rs"
name = "vst3"
required-features = []

[lib]
path = "src/lib.rs"
name = "ether_sandbox"
required-features = []
crate-type = ["lib"]
