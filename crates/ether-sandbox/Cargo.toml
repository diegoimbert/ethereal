[package]
name = "ether-sandbox"
description = "Out-of-process sandboxed PluginNode + helper binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ether-core.workspace = true
# The helper process hosts the plugin in-process through its format's PluginFormatHost.
ether-plugin-host.workspace = true
ether-clap.workspace = true
ether-vst3.workspace = true
ether-au.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
shared_memory.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_no_alloc.workspace = true

[[bin]]
name = "ether-sandbox-helper"
path = "src/bin/ether-sandbox-helper.rs"

[lints]
workspace = true
