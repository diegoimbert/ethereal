[package]
name = "ether-native"
description = "Native host: cpal RT thread, disk streaming, GC thread."

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.assert_no_alloc]
workspace = true
features = ["warn_debug"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cpal]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.crossbeam-channel]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-au]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-clap]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-controller]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-core]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-devices]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-media]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-plugin-host]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-sandbox]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-stretch]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ether-vst3]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.getrandom]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.midir]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rtrb]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rubato]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.serde]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.serde_json]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.thiserror]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tracing]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]

[target."cfg(windows)".dependencies]
asio-sys = "0.2"

[target."cfg(windows)".dependencies.cpal]
workspace = true
features = ["asio"]

[target."cfg(windows)".dependencies.windows-sys]
workspace = true
features = ["Win32_System_Com", "Win32_Media"]

[target."cfg(windows)".dev-dependencies]

[target."cfg(windows)".build-dependencies]

[features]
default = []
full = ["plugins", "warp-complex"]
plugins = ["plugins-clap", "plugins-vst3", "plugins-au", "sandbox"]
plugins-au = ["dep:ether-au"]
plugins-clap = ["dep:ether-clap"]
plugins-vst3 = ["dep:ether-vst3"]
sandbox = ["dep:ether-sandbox"]
warp-complex = ["ether-stretch/signalsmith"]

[[test]]
path = "tests/formats_e2e.rs"
name = "formats_e2e"
required-features = ["plugins-clap", "plugins-vst3", "sandbox"]

[[test]]
path = "tests/plugins_e2e.rs"
name = "plugins_e2e"
required-features = ["plugins-clap", "sandbox"]

[[test]]
path = "tests/plugin_folders_e2e.rs"
