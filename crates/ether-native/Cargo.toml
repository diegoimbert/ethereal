[package]
name = "ether-native"
description = "Native host: cpal RT thread, disk streaming, GC thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ether-core.workspace = true
ether-stretch = { workspace = true, features = ["signalsmith"] }
ether-controller.workspace = true
ether-devices.workspace = true
ether-media.workspace = true
ether-clap.workspace = true
# VST3 + AU (formats-integration): every format goes through ether-plugin-host's Formats.
ether-plugin-host.workspace = true
ether-vst3.workspace = true
ether-au.workspace = true
# Wave-3 registration points: `plugins` (sandbox.rs) and `recording` (recording/).
ether-sandbox.workspace = true
midir.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
getrandom.workspace = true
assert_no_alloc = { workspace = true, features = ["warn_debug"] }
# Listen-on-peer sender (`stream`): tap ring → 48 kHz → Opus → str0m (docs/COLLAB.md §9.1).
rtrb.workspace = true
rubato.workspace = true
str0m.workspace = true
opus.workspace = true
audiopus_sys.workspace = true

# ASIO driver support on Windows (cpal's asio-sys builds against the Steinberg ASIO SDK).
[target.'cfg(windows)'.dependencies]
cpal = { workspace = true, features = ["asio"] }

[lints]
workspace = true
