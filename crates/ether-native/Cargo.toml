[package]
name = "ether-native"
description = "Native host: cpal RT thread, disk streaming, GC thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ether-core.workspace = true
# Complex warp (feature `warp-complex`): Signalsmith Stretch (C++).
ether-stretch.workspace = true
ether-controller.workspace = true
ether-devices.workspace = true
ether-media.workspace = true
# Plugin formats (features `plugins-*`): every format goes through ether-plugin-host's
# Formats; a format left out is `Unsupported` ("not supported by this build").
ether-plugin-host.workspace = true
ether-clap = { workspace = true, optional = true }
ether-vst3 = { workspace = true, optional = true }
ether-au = { workspace = true, optional = true }
# Sandboxed plugins (feature `sandbox`; sandbox.rs).
ether-sandbox = { workspace = true, optional = true }
midir.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
getrandom.workspace = true
assert_no_alloc = { workspace = true, features = ["warn_debug"] }
rtrb.workspace = true
rubato.workspace = true
# The sample pack's downloads (feature `net`; `samples_http.rs`): blocking reqwest + rustls.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

# ASIO driver support on Windows (cpal's asio-sys builds against the Steinberg ASIO SDK).
[target.'cfg(windows)'.dependencies]
cpal = { workspace = true, features = ["asio"] }
# The ASIO driver names without loading the drivers (the version cpal uses).
asio-sys = "0.2"
# COM on the threads that open ASIO drivers (`cpal_host.rs`).
windows-sys = { workspace = true, features = ["Win32_System_Com", "Win32_Media"] }

[lints]
workspace = true

# Cargo features (feature-flags; docs/ARCHITECTURE.md "Cargo features"). The default is the
# fast dev core (`just dev-desktop`, `cargo test -p ether-native`); the shipped apps, the
# gates and `just test-all` / `just check-all` build `full`. A feature that is off compiles
# its code out; its commands reply `Unsupported` (the paths the web host already takes).
[features]
default = []
full = ["net", "plugins", "warp-complex"]
# The sample pack's downloads (`samples_http`). Off: the built-in kit only.
net = ["dep:reqwest"]
# Every plugin format and the sandbox.
plugins = ["plugins-clap", "plugins-vst3", "plugins-au", "sandbox"]
plugins-clap = ["dep:ether-clap"]
plugins-vst3 = ["dep:ether-vst3"]
plugins-au = ["dep:ether-au"]
# Out-of-process (sandboxed) plugin instances. Off: a sandboxed instance fails `Unsupported`.
sandbox = ["dep:ether-sandbox"]
# Complex warp (Signalsmith Stretch). Off: Complex-warped clips play Repitch, as on the web.
warp-complex = ["ether-stretch/signalsmith"]

[[test]]
name = "formats_e2e"
required-features = ["plugins-clap", "plugins-vst3", "sandbox"]

[[test]]
name = "plugins_e2e"
required-features = ["plugins-clap", "sandbox"]

[[test]]
name = "plugin_folders_e2e"
required-features = ["plugins-clap"]

[[test]]
name = "agent_plugins_e2e"
required-features = ["plugins-clap"]

[[test]]
name = "plugin_sidechain"
required-features = ["plugins-clap", "plugins-vst3", "sandbox"]

[[test]]
name = "disk_stream_render"
required-features = ["warp-complex"]

[[test]]
name = "multicore_no_alloc"
required-features = ["warp-complex"]
