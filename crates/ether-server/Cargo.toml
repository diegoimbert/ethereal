[package]
name = "ether-server"
description = "Headless native engine host serving the UI protocol over WebSocket (remote engine)."

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies.crossbeam-channel]
workspace = true

[dependencies.ether-native]
workspace = true

[dependencies.ether-protocol]
workspace = true

[dependencies.getrandom]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.signal-hook]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.tungstenite]
workspace = true

[features]
default = []
full = ["plugins", "warp-complex"]
plugins = ["ether-native/plugins"]
warp-complex = ["ether-native/warp-complex"]

[[bin]]
path = "src/main.rs"
name = "ether-server"
required-features = []

[[test]]
path = "tests/frame_vectors.rs"
name = "frame_vectors"
required-features = []

[[test]]
path = "tests/hardening.rs"
name = "hardening"
required-features = []

[[test]]
path = "tests/session.rs"
name = "session"
required-features = []

[lib]
path = "src/lib.rs"
name = "ether_server"
required-features = []
crate-type = ["lib"]
