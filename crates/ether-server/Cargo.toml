[package]
name = "ether-server"
description = "Headless native engine host serving the UI protocol over WebSocket (remote engine)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Native only: the host is `ether-native` (controller + cpal/null audio + disk store +
# plugins); the socket is `tungstenite` (blocking, one thread per connection).
[dependencies]
ether-protocol.workspace = true
ether-native.workspace = true
crossbeam-channel.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tungstenite.workspace = true

[lints]
workspace = true

[[bin]]
name = "ether-server"
path = "src/main.rs"
