# The full product in this checkout: fetches the private `ee/` repository at `ee-ref` (its own
# Cargo workspace and JS packages over this checkout, built in place). Quiet by design: no
# private commit subject, file name or output reaches the public log.
# Needs the `token` (read access to the private repository); callers run it only when the
# secret is set (never on fork pull requests).
name: EE fetch
description: Fetch the private ee/ repository into this checkout (quietly)

inputs:
  token:
    description: Token with read access to the private repository
    required: true
  ee-ref:
    description: Commit, branch or tag of the private repository
    required: true
  repository:
    description: The private repository
    default: diegoimbert/ethereal-private

outputs:
  ee-sha:
    description: The private commit that was fetched
    value: ${{ steps.fetch.outputs.sha }}

runs:
  using: composite
  steps:
    - id: fetch
      name: Fetch ee/ (quiet)
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ee-ref }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad ee ref"; exit 1; }
        echo "::add-mask::$TOKEN"
        rm -rf ee && mkdir ee
        git -C ee init -q
        # The token only lives in this process's config, never in a file of the checkout.
        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
        echo "::add-mask::$auth"
        git -C ee -c http.extraheader="$auth" fetch -q --depth=1 "https://github.com/$REPO" "$REF" 2>/dev/null \
          || { echo "::error::cannot fetch the private repository at the requested ref"; exit 1; }
        git -C ee -c advice.detachedHead=false checkout -q FETCH_HEAD
        # Public nested submodules (e.g. libvpx).
        git -C ee submodule update -q --init --depth 1 > /dev/null 2>&1
        echo "sha=$(git -C ee rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "ee/ fetched at $(git -C ee rev-parse --short=12 HEAD)"
