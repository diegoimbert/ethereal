# Check out the proprietary overlay (diegoimbert/ethereal-private) and apply its `ee/` payload
# over this (public) checkout, so the rest of the job builds the full product instead of the
# stripped OSS build. Run it right after `actions/checkout`, before building.
#
# Needs a token that can read the private repo: repo secret `ETHER_PRIVATE_TOKEN` — a
# fine-grained PAT with **Contents: read** on `ethereal-private` (or a classic PAT with `repo`).
# The default GITHUB_TOKEN cannot read another private repo.
#
# The overlay copies `ee/` over this workspace (see ethereal-private/overlay.mjs) and deletes
# the few files the private product dropped but the OSS checkout still has; `ee/` then holds the
# private crates, UI, services, wiring, justfile and release scripts that this job uses.
name: Overlay private
description: Check out ethereal-private and overlay its ee/ onto this checkout

inputs:
  token:
    description: Token with read access to diegoimbert/ethereal-private
    required: true
  ref:
    description: "ethereal-private ref to use (default: its default branch)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check out ethereal-private
      uses: actions/checkout@v4
      with:
        repository: diegoimbert/ethereal-private
        token: ${{ inputs.token }}
        ref: ${{ inputs.ref }}
        path: .private
    - name: Apply the overlay
      shell: bash
      run: node .private/overlay.mjs --oss "$GITHUB_WORKSPACE"
