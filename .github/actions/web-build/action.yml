# Build the web app (wasm engine + UI) of the full product and assemble the Cloudflare Pages site
# (the deployed folder `<out>/site`: dist + the COOP/COEP `_headers`, and `<out>/functions`).
# Used by release.yml (the `web` job).
#
# Runs after .github/actions/ee-fetch: the install and build go through
# scripts/ci/private-step.mjs (their output is private; .github/actions/full-logs uploads it
# encrypted), and the Rust cache is restore-only (ci.yml's open-source `web-build` cache): this
# public repository's cache never holds private build output.
name: Web build
description: Build the full product's web app (ee/app/web) and assemble the Cloudflare Pages site

inputs:
  out:
    description: Where to assemble the Pages site (`site/` + `functions/`)
    required: true
  node-version:
    description: Node.js version
    default: "24"
  version:
    description: Version shown by the app (VITE_ETHER_VERSION); empty = the repo VERSION
    default: ""

runs:
  using: composite
  steps:
    - name: Toolchain (from rust-toolchain.toml)
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: runner.environment == 'github-hosted'
      with:
        key: web-build
        save-if: "false"
    - name: wasm-bindgen version (from Cargo.lock)
      id: wb
      shell: bash
      # A pool machine keeps its tools between jobs: install only when missing (concurrent
      # jobs installing into the shared cargo bin dir race).
      run: |
        v="$(grep -A1 '^name = "wasm-bindgen"$' ee/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
        echo "version=$v" >> "$GITHUB_OUTPUT"
        if [ "$(wasm-bindgen --version 2>/dev/null)" = "wasm-bindgen $v" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; fi
    - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      if: steps.wb.outputs.have != 'true'
      with:
        tool: wasm-bindgen@${{ steps.wb.outputs.version }}
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    # No package-manager cache: it would save the overlaid tree's store.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: install
      shell: bash
      run: node scripts/ci/private-step.mjs web-install -- "pnpm install --frozen-lockfile && pnpm --dir ee install --frozen-lockfile && node ee/app/link.mjs"
    - name: Build (wasm engine + UI)
      shell: bash
      env:
        VITE_ETHER_VERSION: ${{ inputs.version }}
      run: node scripts/ci/private-step.mjs web-build -- npm run --prefix ee/app build:web
    - name: Site for Cloudflare Pages (dist + COOP/COEP _headers)
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        mkdir -p "$OUT/site"
        cp -R ee/app/web/dist/. "$OUT/site/"
        cp scripts/release/web/_headers "$OUT/site/_headers"
        # Cloudflare Pages refuses a file over 25 MiB (and only says so deep in its upload).
        big="$(find "$OUT/site" -type f -size +25M)"
        if [ -n "$big" ]; then
          echo "::error::Over Cloudflare Pages' 25 MiB per-file limit: $(ls -l $big)"
          exit 1
        fi
        # The full product's Pages Functions (/signal, /static): wrangler bundles `functions/`
        # from next to the deployed folder.
        if [ -d ee/scripts/release/web/functions ]; then cp -R ee/scripts/release/web/functions "$OUT/functions"; fi
