# Uploads the full-product job's logs (scripts/ci/private-step.mjs writes them) as an artifact
# encrypted with age to the private repository's recipients (ee/.sops.yaml), so only the
# maintainers can read them: `just full-logs <run-id>` downloads and decrypts. The public log
# never holds them in clear.
name: Full logs (encrypted)
description: Encrypt the full-product logs with age and upload them

inputs:
  name:
    description: Artifact name (unique in the run)
    required: true

runs:
  using: composite
  steps:
    - name: Install age 1.3.2 (checksum-verified release)
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) f=age-v1.3.2-linux-amd64.tar.gz; sum=cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10 ;;
          macOS-ARM64) f=age-v1.3.2-darwin-arm64.tar.gz; sum=e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5 ;;
          Windows-X64) f=age-v1.3.2-windows-amd64.zip; sum=f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7 ;;
          *) echo "::error::no age build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        d="$RUNNER_TEMP/age-dl"; mkdir -p "$d"
        curl -sSfL -o "$d/$f" "https://github.com/FiloSottile/age/releases/download/v1.3.2/$f"
        if command -v sha256sum > /dev/null; then echo "$sum  $d/$f" | sha256sum -c - > /dev/null; else echo "$sum  $d/$f" | shasum -a 256 -c - > /dev/null; fi
        case "$f" in *.zip) unzip -q -o "$d/$f" -d "$d" ;; *) tar -xzf "$d/$f" -C "$d" ;; esac
        echo "$d/age" >> "$GITHUB_PATH"
    - name: Encrypt the logs
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        logs="${FULL_LOG_DIR:-$RUNNER_TEMP/full-logs}"
        mkdir -p "$logs" "$RUNNER_TEMP/full-logs-out"
        recipients=()
        for r in $(grep -oE 'age1[0-9a-z]{58}' ee/.sops.yaml 2>/dev/null | sort -u); do recipients+=(-r "$r"); done
        if [ ${#recipients[@]} -eq 0 ]; then
          echo "::warning::no age recipients in ee/.sops.yaml: the full log is not uploaded"
          rm -rf "$logs"; exit 0
        fi
        tar -czf - -C "$logs" . | age "${recipients[@]}" -o "$RUNNER_TEMP/full-logs-out/$NAME.tar.gz.age"
        rm -rf "$logs"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/full-logs-out/*.age
        retention-days: 14
        if-no-files-found: ignore
