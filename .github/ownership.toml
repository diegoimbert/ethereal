  "crates/ether-native/src/host.rs",
  # packaging: nothing new to ship (formats are linked into the scanner/helper/app), listed for codesign tweaks
  "apps/desktop/src-tauri/Cargo.toml",
]

# --- Roadmap features (contracts-2) -----------------------------------------------------
# contracts-2 pre-created one module per feature and layer, registered with one line in its
# parent (see docs/ROADMAP.md for hook points). Each node owns its modules, UI feature
# folder and test files. "shared touch" = minimal, additive edits in a shared file (a
# one-line call into the node's module, a match arm, a trait impl); coordinate hot files
# (engine.rs, graph.rs, mixer.rs) through the manager.

[nodes.export]
paths = [
  "ui/src/features/export/**",
  "crates/ether-controller/src/export/**",
  "crates/ether-core/src/offline.rs",
  "crates/ether-controller/tests/export*.rs",
  "crates/ether-core/tests/offline*.rs",
  "apps/web/e2e/export.spec.ts",
  # shared touch: hound/flacenc deps (pre-declared in the workspace)
  "crates/ether-controller/Cargo.toml",
  # shared touch: EngineBridge::create_offline_plugin impl (native plugins)
  "crates/ether-native/src/bridge.rs",
  # shared touch: writing exports/<file> through the store
  "crates/ether-controller/src/store.rs",
  "crates/ether-native/src/store.rs",
  "crates/ether-wasm/src/store.rs",
]

