# --- Plugin formats (formats-base; docs/PLUGIN-FORMATS.md) ----------------------------
# `vst3` and `au` each implement one PluginFormatHost in their own crate (no shared files:
# the scanner and sandbox helper already register both stubs). `formats-integration`
# wires the formats into the native host/bridge/UI afterwards.

[nodes.vst3]
paths = [
  "crates/ether-vst3/**",
  # tests through the real scanner binary / sandbox helper (CARGO_BIN_EXE_* only exists there)
  "crates/ether-plugin-scanner/tests/vst3.rs",
  "crates/ether-sandbox/tests/vst3.rs",
]

[nodes.au]
paths = [
  "crates/ether-au/**",
  # tests through the real scanner binary / sandbox helper (CARGO_BIN_EXE_* only exists there)
  "crates/ether-plugin-scanner/tests/au.rs",
  "crates/ether-sandbox/tests/au.rs",
]

[nodes.formats-integration]
paths = [
  "crates/ether-native/src/plugins.rs",
  "crates/ether-native/src/sandbox.rs",
  "crates/ether-native/src/bridge.rs",
  "crates/ether-native/Cargo.toml",
  "crates/ether-native/tests/plugins_e2e.rs",
  "crates/ether-native/tests/formats_e2e.rs",
  "crates/ether-plugin-host/**",
  "crates/ether-plugin-scanner/**",
  "crates/ether-sandbox/src/helper.rs",
  "crates/ether-sandbox/src/host.rs",
  "crates/ether-sandbox/src/lib.rs",
  "ui/src/features/plugins/**",
  "docs/PLUGIN-FORMATS.md",
