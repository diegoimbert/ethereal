# Weekly, low-noise updates: per ecosystem, one grouped pull request for the minor and patch
# bumps; each new major gets its own pull request. At most 5 open pull requests per ecosystem.
version: 2
updates:
  # Keeps the SHA-pinned actions current (each pin and its version comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The composite actions also run on the private side's self-hosted runners: minor and patch
  # bumps only; a new major is a deliberate change there.
  - package-ecosystem: github-actions
    directory: "/.github/actions/web-build"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composite-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Tauri's Rust crates and its JS packages move together, in their own group. A bump that
  # changes a license text fails the "Notices fresh" check: run `just notices` on the branch
  # and push.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
        update-types: ["minor", "patch"]
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
        update-types: ["minor", "patch"]
      js:
        patterns: ["*"]
        update-types: ["minor", "patch"]
