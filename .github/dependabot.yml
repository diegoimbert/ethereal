# Keeps the SHA-pinned actions current: one grouped pull request a month, which updates each
# pin and its version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The composite actions also run on the private side's self-hosted runners: minor and patch
  # bumps only; a new major is a deliberate change there.
  - package-ecosystem: github-actions
    directory: "/.github/actions/web-build"
    schedule:
      interval: monthly
    groups:
      composite-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Rust and pnpm: one grouped pull request a month per ecosystem for the minor and patch bumps;
  # each new major gets its own pull request. Tauri's Rust crates and its JS packages move
  # together, in their own group. A bump that changes a license text fails the "Notices fresh"
  # check: run `just notices` on the branch and push.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
        update-types: ["minor", "patch"]
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
        update-types: ["minor", "patch"]
      js:
        patterns: ["*"]
        update-types: ["minor", "patch"]
