# Keeps the SHA-pinned actions current: one grouped pull request a month, which updates each
# pin and its version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The composite actions also run on the private side's self-hosted runners: minor and patch
  # bumps only; a new major is a deliberate change there.
  - package-ecosystem: github-actions
    directory: "/.github/actions/web-build"
    schedule:
      interval: monthly
    groups:
      composite-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
