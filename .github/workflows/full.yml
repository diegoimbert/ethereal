name: Full product
# A dispatch names the commits it builds (`feat ship` finds an EE-only change's build by it).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Full product: {0} + ee {1}', inputs.ref, inputs.ee_ref || 'pointer') || '' }}

# The full product: this repository with the private `ee/` repository overlaid (docs/EE-WORKFLOW.md),
# built and tested on every push to main and on demand. Pull requests run no builds or tests
# (owner, 2026-10-19: only CLA, Policy, What changed and ee/pointer gate a merge); a PR's full
# build is a dispatch: `gh workflow run full.yml --ref <branch> -f ref=<sha>` (a fork's PR only
# after reading it: `-f ref=refs/pull/N/head`). Never `pull_request_target`.
#
# Safety, since this repository is public:
#   - The private code is fetched with the ETHER_PRIVATE_TOKEN secret (never on fork events).
#   - No private code in the public log: every step that compiles or runs it goes through
#     scripts/ci/private-step.mjs (its output goes to a file; the log shows the result and the
#     names of what failed), and the files are uploaded encrypted with age to the private
#     repository's recipients (`just full-logs <run-id>` decrypts them).
#   - No private build output in the Actions cache (a fork's pull request can restore caches made
#     on main): the Rust jobs cache only third-party builds (cargo-chef, .github/actions/chef-cache,
#     checked before every save), the web jobs restore ci.yml's OSS-only caches; only main saves.
#
# macOS and Windows: full-platforms.yml, a workflow of its own (their ~50-60 min would hold up
# this one's cycle on `main`, whose pushes are serialized per workflow).
#
# Runners: repository variables FULL_RUNNER / FULL_E2E_RUNNER (JSON, e.g.
# '"ubuntu-latest"' or '["self-hosted","devbox-pool"]') pick the build jobs' runners;
# GitHub-hosted by default. The short jobs (Resolve, ee/build) stay GitHub-hosted, so
# a busy pool never holds up the start of a run. On the devbox pool (docs/CI-RUNNERS.md) the job
# ids name the cargo target dirs (`full-*`, apart from ci.yml's open-source ones), the
# GitHub-hosted-only steps are skipped, and a hook empties the overlay from the workspace after
# every job.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: OSS ref to build (e.g. refs/pull/N/head after reading the diff)
        default: main
      ee_ref:
        description: Private ref to overlay (empty = the ref's ee pointer, else EE main)
        default: ""
      all:
        description: Also the e2e suite (macOS and Windows are full-platforms.yml)
        type: boolean
        default: true

permissions:
  contents: read

# Pushes to main share one group that never cancels a running run: it goes to the end (green or
# red), the newest push waits, the ones in between are skipped (reported as cancelled). The
# `Main status` workflow reports the latest run that finished.
concurrency:
  group: full-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  ETHER_AUDIO: "null"
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"
  # The full product's engine messages: the private undo labels, notices and errors live in
  # ee/'s catalogs, merged into the controller's tables at build time (docs/EXTENSIONS.md),
  # as ee/'s justfile does locally. Without it the catalog tests fail on the private ids.
  ETHER_EXTRA_LOCALES: ${{ github.workspace }}/ee/app/src/i18n/ee-locales

jobs:
  resolve:
    # What to build, and whether this run may see the private code at all.
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.r.outputs.enabled }}
      oss_ref: ${{ steps.r.outputs.oss_ref }}
      ee_ref: ${{ steps.r.outputs.ee_ref }}
      all: ${{ steps.r.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}
      - id: r
        uses: ./.github/actions/full-resolve
        with:
          token: ${{ secrets.ETHER_PRIVATE_TOKEN }}
          ee-ref: ${{ inputs.ee_ref }}
          all: ${{ inputs.all }}

  full-rust-linux:
    name: Full Rust (Linux)
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ${{ fromJSON(vars.FULL_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.oss_ref }}
      - uses: ./.github/actions/free-disk
      - name: Linux system deps (Tauri, ALSA)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config > /dev/null
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: ./.github/actions/ee-overlay
        with:
          token: ${{ secrets.ETHER_PRIVATE_TOKEN }}
          ee-ref: ${{ needs.resolve.outputs.ee_ref }}
          drift-check: "true"
      # Self-hosted runners keep their own target dirs: no Actions cache there.
      - uses: ./.github/actions/chef-cache
        if: runner.environment == 'github-hosted'
        with:
          name: full-linux
          clippy: "true"
      - name: fmt
        run: node scripts/ci/private-step.mjs fmt -- cargo fmt --all --check
      - name: clippy
        run: node scripts/ci/private-step.mjs clippy -- cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: >-
          node scripts/ci/private-step.mjs test -- cargo nextest run --profile ci --workspace --all-features
          -E 'not (test(=appended_params_keep_the_default_sound) | test(=patches_from_before_render_as_before))'
      - name: Sweep stale test binaries (self-hosted target dir)
        if: ${{ !cancelled() && runner.environment != 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/ci/private-step.mjs sweep -- node scripts/ci/sweep-test-binaries.mjs -- --workspace --all-features
      - name: wasm32 check
        run: node scripts/ci/private-step.mjs wasm32 -- cargo check --target wasm32-unknown-unknown -p ether-protocol -p ether-model -p ether-core -p ether-devices -p ether-media -p ether-controller -p ether-stretch -p ether-wasm --all-features
      - uses: ./.github/actions/full-logs
        if: always()
        with:
          name: full-logs-rust-linux

  full-web:
    name: Full web (tsc, eslint, prettier, vitest, build)
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ${{ fromJSON(vars.FULL_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.oss_ref }}
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: web-build
          save-if: "false"
      - name: wasm-bindgen version (from Cargo.lock)
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - uses: ./.github/actions/ee-overlay
        with:
          token: ${{ secrets.ETHER_PRIVATE_TOKEN }}
          ee-ref: ${{ needs.resolve.outputs.ee_ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No setup-node cache: it would save the overlaid tree's package store.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: install
        run: node scripts/ci/private-step.mjs install -- pnpm install --frozen-lockfile
      - name: tsc
        run: node scripts/ci/private-step.mjs tsc -- pnpm -r typecheck
      - name: eslint
        run: node scripts/ci/private-step.mjs eslint -- pnpm -r lint
      - name: prettier
        run: node scripts/ci/private-step.mjs prettier -- pnpm format:check
      - name: vitest
        run: node scripts/ci/private-step.mjs vitest -- pnpm -r test
      - name: build ui + web
        run: node scripts/ci/private-step.mjs build -- "pnpm --filter @ethereal/ui build && pnpm --filter @ethereal/web build"
      - uses: ./.github/actions/full-logs
        if: always()
        with:
          name: full-logs-web

  full-e2e:
    # The Playwright suite on the full build (pushes to main and manual runs: the per-PR e2e is
    # ci.yml's, on the open-source build). It runs ee/app's config: the OSS specs and the EE ones
    # (an EE `<name>.full.spec.ts` replaces the OSS `<name>.spec.ts`) against the full UI;
    # apps/web's config would test the open-source UI and leave the EE specs out.
    name: Full e2e (${{ matrix.shard }}/4)
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.all == 'true'
    # Its own variable (FULL_E2E_RUNNER): four shards per run would hold the pool's few slots;
    # GitHub-hosted by default.
    runs-on: ${{ fromJSON(vars.FULL_E2E_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.oss_ref }}
      - uses: ./.github/actions/free-disk
      - name: Linux system deps (ALSA)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev pkg-config > /dev/null
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: web-build
          save-if: "false"
      - name: wasm-bindgen version (from Cargo.lock)
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - uses: ./.github/actions/ee-overlay
        with:
          token: ${{ secrets.ETHER_PRIVATE_TOKEN }}
          ee-ref: ${{ needs.resolve.outputs.ee_ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: install
        # ee/'s own workspace too: its services (the signaling adapter the share specs start).
        run: node scripts/ci/private-step.mjs install -- "pnpm install --frozen-lockfile && pnpm --dir ee install --frozen-lockfile && cd apps/web && npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium-headless-shell"
      - name: Playwright
        env:
          ETHEREAL_TOURS: "1"
          ETHER_E2E_PREBUILD: "1"
          SHARD: ${{ matrix.shard }}
        run: >-
          node scripts/ci/private-step.mjs e2e -- "cd ee/app && npm run test:e2e --
          --workers=2 --shard=$SHARD/4 --grep-invert '@frames|@pixels' --retries=1 --reporter=list"
      - uses: ./.github/actions/full-logs
        if: always()
        with:
          name: full-logs-e2e-${{ matrix.shard }}

  ee-build:
    # The aggregate check: green when every job of this workflow passed or was skipped (e2e on a
    # dispatch without `all`). macOS and Windows are full-platforms.yml's, outside this check.
    name: ee/build
    needs: [resolve, full-rust-linux, full-web, full-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')"
          if [ -n "$bad" ]; then echo "::error::full product: $bad"; exit 1; fi
