name: CI

# OSS only: every job builds this repo on its own, with `ee/` (the private submodule) empty.
# The full product (OSS + ee/) is built on the private side, which reports back to OSS PRs as
# the `ee/build` and `ee/pointer` commit statuses (docs/EE-WORKFLOW.md).
#
# Runners (docs/CI-RUNNERS.md): the Linux build and test jobs of trusted runs (pushes to `main`,
# manual runs; never a bot) go to the devbox runner pool when the repository variable CI_POOL is
# `devbox`; everything else (pull requests, macOS, Windows) runs on GitHub-hosted runners. No job
# has a secret.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its release);
# Dependabot (.github/dependabot.yml) proposes the bumps. The Rust toolchain is pinned in
# rust-toolchain.toml, tools installed by taiki-e/install-action are pinned to exact versions.
#
# What runs when: pull requests run the cheap checks only (`What changed` and `Policy`; the CLA
# check and `ee/pointer` come from elsewhere). Builds and tests run on `main` and manual runs,
# every platform. A failure there is fixed forward: the `main is red` job opens (or comments on)
# an issue labelled `ci-main`, and the fix lands as a follow-up pull request.
#
# Caches: the repository has 10 GB of Actions cache. Only `main` saves Rust caches (pull
# requests restore them), so pull requests cannot evict `main`'s and every job starts warm.
on:
  pull_request:
  push:
    branches: [main]
    # A pointer bump of the private submodule changes nothing this workflow builds.
    paths-ignore: [ee]
  workflow_dispatch:
    inputs:
      full:
        description: "Builds and tests on every platform (false: the pull-request checks only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes its last run. Runs on `main` are not serialized as a
  # whole: each build job is a lane of its own (the job-level `concurrency` below), so a quick
  # Linux job tests the newest `main` while a slow Windows job of an older run finishes. A lane
  # runs one job at a time, always to the end (it saves the caches pull requests start from), and
  # only the newest waiting one: older waiting ones are dropped (reported as cancelled).
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep backtraces readable at a fraction of full debuginfo's build, link and
  # cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  ETHER_AUDIO: "null"
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"

jobs:
  changes:
    # Decides what this run builds. Pull requests: nothing (the build and test jobs report as
    # skipped). `main` and manual runs: everything, on every platform.
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.what.outputs.full }}
      linux: ${{ steps.what.outputs.linux }}
    steps:
      - id: what
        # The pool runs trusted jobs only; its runners refuse anything else anyway
        # (scripts/ci/runner/trust.mjs mirrors these rules).
        env:
          EVENT: ${{ github.event_name }}
          POOL: ${{ vars.CI_POOL }}
          ACTOR: ${{ github.actor }}
          # Manual runs: the `full` input (the Dependabot notices workflow dispatches the cheap
          # checks only).
          FULL_INPUT: ${{ inputs.full }}
        run: |
          full=true
          [ "$EVENT" = pull_request ] && full=false
          [ "$EVENT" = workflow_dispatch ] && [ "$FULL_INPUT" = false ] && full=false
          linux='"ubuntu-latest"'
          case "$ACTOR" in *'[bot]') ;; *)
            if [ "$POOL" = devbox ] && [ "$EVENT" != pull_request ]; then linux='["self-hosted","devbox-pool"]'; fi ;;
          esac
          { echo "full=$full"; echo "linux=$linux"; } >> "$GITHUB_OUTPUT"
          echo "Builds and tests: $full. Linux jobs run on: $linux"

  # --- Rust ---------------------------------------------------------------------------------

  rust-linux:
    name: Rust (Linux)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 60
    concurrency:
      group: ci-lane-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}-rust-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
        if: runner.environment == 'github-hosted'
      - name: Linux system deps (Tauri, ALSA)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # `effects_defaults`/`instruments_*` have golden-hash tests recorded on one x86_64
        # Linux box; the GitHub runner's CPU/libm render the same audio with different rounding,
        # so they are devbox tools, not CI gates (elsewhere they check nothing bit-exact).
        run: >-
          cargo nextest run --profile ci --workspace --all-features
          -E 'not (test(=appended_params_keep_the_default_sound) | test(=patches_from_before_render_as_before))'
      - name: doctests
        run: cargo test --workspace --all-features --doc
      - name: wasm32 check
        run: cargo check --target wasm32-unknown-unknown -p ether-protocol -p ether-model -p ether-core -p ether-devices -p ether-media -p ether-controller -p ether-stretch -p ether-wasm --all-features
      - name: Generated TS types fresh
        run: |
          cargo run -q -p ether-protocol --example gen-ts -- ui/src/generated
          if [ -n "$(git status --porcelain -- ui/src/generated)" ]; then
            git status --porcelain -- ui/src/generated
            git diff -- ui/src/generated | head -200
            echo "::error::ui/src/generated is stale. Run 'just gen-types' and commit."
            exit 1
          fi

  rust-macos:
    # The macOS-specific code: plugin hosting (AU, CLAP, VST3, scanner, sandbox), the CoreAudio
    # host, the server, and the DSP crates on aarch64. The platform-neutral rest (controller,
    # model, protocol, wasm) is tested on Linux and Windows; clippy still covers everything.
    # macOS runners are the scarcest (5 at a time per account), so this job stays lean.
    name: Rust (macOS)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    concurrency:
      group: ci-lane-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}-rust-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
        if: runner.environment == 'github-hosted'
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # dropping_without_deactivate_is_safe deadlocks on these runners (#45).
        run: >-
          cargo nextest run --profile ci --all-features
          -p ether-au -p ether-clap -p ether-vst3 -p ether-plugin-host -p ether-plugin-scanner
          -p ether-sandbox -p ether-native -p ether-server -p ether-mcp
          -p ether-core -p ether-devices -p ether-media -p ether-stretch
          -E 'not test(=dropping_without_deactivate_is_safe)'

  rust-windows:
    name: Rust (Windows)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    concurrency:
      group: ci-lane-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}-rust-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
        if: runner.environment == 'github-hosted'
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # `ether-desktop`'s test binaries link the Tauri app, which needs the Common Controls v6
        # manifest an installed app carries; bare, they don't start (0xc0000139). Its tests run on
        # Linux, and the Windows packaging job builds and bundles it.
        run: cargo nextest run --profile ci --workspace --all-features --exclude ether-desktop

  # --- Web ----------------------------------------------------------------------------------

  web:
    name: Web (tsc, eslint, prettier, vitest)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 20
    concurrency:
      group: ci-lane-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm -r typecheck
      - name: eslint
        run: pnpm -r lint
      - name: prettier
        run: pnpm format:check
      - name: case clashes
        run: node scripts/check-case-clashes.mjs
      - name: vitest
        run: pnpm -r test
      - name: release and CI scripts
        run: node --test scripts/release/*.test.mjs scripts/ci/*.test.mjs

  web-build:
    # The web build the e2e shards test (wasm engine + UI, `vite build`), the native server some
    # specs drive, the release's web zip, and the production bundle under the deployed
    # Content-Security-Policy (any violation fails, e2e/global-teardown.ts).
    name: Web build (wasm, dist, server) + CSP
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 40
    concurrency:
      group: ci-lane-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}-web-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system deps (ALSA)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: web-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: wasm-bindgen version (from Cargo.lock)
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: build ui + web
        run: |
          pnpm --filter @ethereal/ui build
          pnpm --filter @ethereal/web build
      - name: web release zip
        run: node scripts/release/collect.mjs web "$(cat VERSION)" "$RUNNER_TEMP/web-release"
      - name: ether-server (the e2e specs' native engine)
        # Same package/features as e2e/server.ts, so the binary is the one the specs expect.
        run: |
          cargo build -p ether-server --bin ether-server --features full
          mkdir -p "$RUNNER_TEMP/e2e-bin"
          cp "${CARGO_TARGET_DIR:-target}/debug/ether-server" "$RUNNER_TEMP/e2e-bin/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web
          # Relative to apps/web: the wasm pkg (dev server) and dist (preview).
          path: |
            apps/web/src/wasm/pkg
            apps/web/dist
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-bin
          path: ${{ runner.temp }}/e2e-bin
          retention-days: 3
          if-no-files-found: error
      - name: Playwright browser
        working-directory: apps/web
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium-headless-shell
      - name: CSP (production bundle under the deployed policy)
        working-directory: apps/web
        env:
          ETHER_E2E_PREVIEW: "1"
        run: npx playwright test --project=webgl --workers=2 smoke.spec.ts launch.spec.ts flow.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-csp
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    # The Playwright suite (real wasm engine + controller in headless Chromium, both arranger
    # backends) and the guided tours walkthrough, sharded. One retry: a spec that only passes on
    # its retry is reported as flaky in the log (a bug to fix), without blocking the merge.
    # Left out: `@frames` (frame-time budgets) and `@pixels` (text rasterization against the
    # DOM), both calibrated on the devbox and not stable on shared runners.
    name: e2e (${{ matrix.shard }}/4)
    needs: [changes, web-build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 30
    concurrency:
      group: ci-lane-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}-e2e-${{ strategy.job-index }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-web
          path: apps/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-bin
          path: ${{ runner.temp }}/e2e-bin
      - name: Playwright browser
        working-directory: apps/web
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium-headless-shell
      - name: Playwright
        working-directory: apps/web
        env:
          ETHEREAL_TOURS: "1"
          ETHER_E2E_SERVER_BIN: ${{ runner.temp }}/e2e-bin/ether-server
          SHARD: ${{ matrix.shard }}
        run: |
          chmod +x "$ETHER_E2E_SERVER_BIN"
          npx playwright test --workers=2 --shard="$SHARD/4" --grep-invert "@frames|@pixels" --retries=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # --- Packaging ----------------------------------------------------------------------------

  package:
    # The release's desktop packaging path, before merge: tauri.conf.json's beforeBuildCommand
    # (UI + helpers + MCP server staged by build-sandbox-helper.mjs --bundle), the release
    # config overlay (tauri-config.mjs: version, Windows `externalBin`), the bundler, and
    # collect.mjs's checks that the helpers are inside the package. Open-source build only
    # (the official one adds the private overlay); unsigned. Release builds use LTO and one
    # codegen unit; here only the packaging is under test, so both are off to keep it fast.
    name: Package (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os == 'linux' && fromJSON(needs.changes.outputs.linux) || matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: ci-lane-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}-package-${{ strategy.job-index }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux deb
            os: linux
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: Windows nsis
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
        if: runner.environment == 'github-hosted'
      - name: Windows (aws-lc-sys without NASM)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
      - name: Linux system deps (Tauri, ALSA)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev pkg-config
      - name: Toolchain (from rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: package-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Release config overlay
        shell: bash
        run: node scripts/release/tauri-config.mjs "$RUNNER_TEMP/tauri.release.json"
      - name: tauri build
        shell: bash
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --ci --features full --target "$TARGET" --bundles "$BUNDLES" --config "$RUNNER_TEMP/tauri.release.json"
      - name: Collect (checks the helpers are packaged)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/release/collect.mjs desktop "$TARGET" "$RUNNER_TEMP/out"

  # --- Policy -------------------------------------------------------------------------------

  policy:
    name: Policy (licenses, notices, advisories, ee boundary, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSS code and manifests never reference the private submodule
        run: |
          if git grep -nE '(\.\./)*\bee/(crates|ui|services|apps|scripts)/' -- '*.toml' '*.json' '*.ts' '*.tsx' '*.rs' '*.mjs' ':!scripts/feat.mjs'; then
            echo "::error::OSS must not depend on ee/ (docs/EE-WORKFLOW.md: ee/ may depend on OSS, never the reverse)"
            exit 1
          fi
          git config -f .gitmodules submodule.ee.update | grep -qx none || { echo "::error::.gitmodules: ee needs update = none"; exit 1; }
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Install actionlint 1.7.12 (checksum-verified release)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-bundle-licenses@4.2.0
      - name: actionlint
        run: actionlint
      - name: Licenses, bans, sources (cargo-deny)
        run: cargo deny check licenses bans sources
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Notices fresh
        run: |
          node scripts/gen-notices.mjs
          if [ -n "$(git status --porcelain -- THIRD-PARTY-NOTICES.md)" ]; then
            git diff -- THIRD-PARTY-NOTICES.md | head -200
            echo "::error::THIRD-PARTY-NOTICES.md is stale. Run 'just notices' and commit."
            exit 1
          fi
      - name: Does this change the dependencies?
        # Advisories gate a pull request only when it changes a lockfile (or the policy): a new
        # advisory against an existing dependency must not block unrelated work. `main` and the
        # daily run (advisories.yml) always gate.
        id: deps
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gate=true
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            git diff --quiet FETCH_HEAD HEAD -- Cargo.lock pnpm-lock.yaml deny.toml && gate=false
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "advisories gate: $gate"
      - name: Advisories (cargo-deny)
        continue-on-error: ${{ steps.deps.outputs.gate != 'true' }}
        run: cargo deny check advisories
      - name: Advisories (pnpm audit, production dependencies)
        continue-on-error: ${{ steps.deps.outputs.gate != 'true' }}
        run: pnpm audit --prod --audit-level high

  # --- main is red ---------------------------------------------------------------------------

  main-red:
    # Pull requests no longer run the cross-platform jobs, so `main` is where a macOS, Windows
    # or packaging break shows up first: fix it forward. One open `ci-main` issue collects them.
    name: main is red
    needs: [changes, rust-linux, rust-macos, rust-windows, web, web-build, e2e, package, policy]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          body="CI failed on \`main\` at $SHA: $RUN"
          open=$(gh issue list --label ci-main --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create ci-main --color B60205 --description "CI is red on main" 2>/dev/null || true
            gh issue create --title "CI is red on main" --label ci-main --body "$body

          Pull requests run Linux and the cheap checks only; the cross-platform jobs run on \`main\`. Fix forward, then close this issue."
          fi
