name: CI

# OSS only: every job builds this repo on its own, with `ee/` (the private submodule) empty.
# The full product (OSS + ee/) is built on the private side, which reports back to OSS PRs as
# the `ee/build` and `ee/pointer` commit statuses (docs/EE-WORKFLOW.md).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ETHER_AUDIO: "null"

jobs:
  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # `ether-desktop`'s test build links `run`'s `generate_context!` and the ai_http test's;
        # on macOS the two `_EMBED_INFO_PLIST` symbols fail to link. Its tests run in the OSS
        # job on Linux instead.
        run: cargo test --workspace --all-features --exclude ether-desktop
      - name: wasm32 check
        run: cargo check --target wasm32-unknown-unknown -p ether-protocol -p ether-model -p ether-core -p ether-devices -p ether-media -p ether-controller -p ether-stretch -p ether-wasm --all-features

  rust-check:
    name: Rust check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (Tauri, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

  types-fresh:
    name: Generated TS types fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gen-types
      - name: Regenerate
        run: cargo run -q -p ether-protocol --example gen-ts -- ui/src/generated
      - name: Diff
        run: |
          if [ -n "$(git status --porcelain -- ui/src/generated)" ]; then
            git status --porcelain -- ui/src/generated
            git diff -- ui/src/generated | head -200
            echo "::error::ui/src/generated is stale. Run 'just gen-types' and commit."
            exit 1
          fi

  licenses:
    name: Licenses (cargo-deny) and notices fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gen-notices
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-bundle-licenses@4.2.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Notices fresh
        run: |
          node scripts/gen-notices.mjs
          if [ -n "$(git status --porcelain -- THIRD-PARTY-NOTICES.md)" ]; then
            git diff -- THIRD-PARTY-NOTICES.md | head -200
            echo "::error::THIRD-PARTY-NOTICES.md is stale. Run 'just notices' and commit."
            exit 1
          fi

  ee-boundary:
    name: No references into ee/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSS code and manifests never reference the private submodule
        run: |
          if git grep -nE '(\.\./)*\bee/(crates|ui|services|apps|scripts)/' -- '*.toml' '*.json' '*.ts' '*.tsx' '*.rs' '*.mjs' ':!scripts/feat.mjs'; then
            echo "::error::OSS must not depend on ee/ (docs/EE-WORKFLOW.md: ee/ may depend on OSS, never the reverse)"
            exit 1
          fi
          git config -f .gitmodules submodule.ee.update | grep -qx none || { echo "::error::.gitmodules: ee needs update = none"; exit 1; }

  # The OSS repo is the public, self-contained DAW; it must build and pass its tests on its own.
  # No job here needs a secret, so they all gate pull requests from forks too.
  oss-rust:
    name: OSS Rust (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system deps (Tauri, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: oss
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # `effects_defaults`/`instruments_*` have golden-hash tests recorded on one x86_64
        # Linux box; the GitHub runner's CPU/libm render the same audio with different rounding,
        # so they are devbox tools, not CI gates (the original CI only ran the suite on macOS,
        # where they are cfg'd out). Everything else runs.
        run: cargo test --workspace --all-features -- --skip appended_params_keep_the_default_sound --skip patches_from_before_render_as_before
      - name: wasm32 check
        run: cargo check --target wasm32-unknown-unknown -p ether-protocol -p ether-model -p ether-core -p ether-devices -p ether-media -p ether-controller -p ether-stretch -p ether-wasm --all-features

  oss-web:
    name: OSS web (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: pnpm -r typecheck
      - name: eslint
        run: pnpm -r lint
      - name: prettier
        run: pnpm format:check
      - name: vitest
        run: pnpm -r test
      - name: wasm-bindgen version (from Cargo.lock)
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - name: build ui + web
        run: |
          pnpm --filter @ethereal/ui build
          pnpm --filter @ethereal/web build
