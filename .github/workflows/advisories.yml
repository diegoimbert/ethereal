name: Advisories

# Daily: security advisories (RustSec, npm) against the dependencies on `main`. Pull requests
# are gated on them only when they change a lockfile (ci.yml, `policy`), so a new advisory
# against an existing dependency shows up here first.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories (cargo-deny, pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny (advisories, yanked crates)
        run: cargo deny check advisories
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  advisories-ee:
    # The full product's workspace (ee/deny.toml), daily too. Its dependency tree is private:
    # the output stays out of this public log (scripts/ci/private-step.mjs; `just full-logs`).
    name: Advisories (ee/, cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: r
        uses: ./.github/actions/full-resolve
        with:
          token: ${{ secrets.ETHER_PRIVATE_TOKEN }}
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.r.outputs.enabled == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: steps.r.outputs.enabled == 'true'
        with:
          tool: cargo-deny@0.20.2
      - uses: ./.github/actions/ee-fetch
        if: steps.r.outputs.enabled == 'true'
        with:
          token: ${{ secrets.ETHER_PRIVATE_TOKEN }}
          ee-ref: ${{ steps.r.outputs.ee_ref }}
      - name: cargo-deny (ee/ advisories)
        if: steps.r.outputs.enabled == 'true'
        run: node scripts/ci/private-step.mjs advisories-ee -- "cd ee && cargo deny check advisories"
      - uses: ./.github/actions/full-logs
        if: always() && steps.r.outputs.enabled == 'true'
        with:
          name: full-logs-advisories-ee
