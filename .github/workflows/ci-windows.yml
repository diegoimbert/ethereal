name: CI (Windows)

# ci.yml's Windows jobs (Rust clippy + tests, the nsis package), in a workflow of their own: they
# take ~35 min where the rest of CI takes ~20, and pushes to `main` are serialized per workflow,
# so with them in ci.yml every Linux/macOS/web result waited for the last Windows run.
# Pull requests don't run this (owner, 2026-10-19: no builds or tests on pull requests). Runs on
# GitHub-hosted runners only; no job has a secret. Its result reaches the `ci-main` issue through
# the `Main status` workflow.
on:
  push:
    branches: [main]
    # A pointer bump of the private submodule changes nothing this workflow builds.
    paths-ignore: [ee]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes to `main`: one run goes to the end, the newest push waits, the ones in between are
  # skipped (reported as cancelled). Manual runs are a group of their own.
  group: ci-windows-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep backtraces readable at a fraction of full debuginfo's build, link and
  # cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  ETHER_AUDIO: "null"
  RUST_BACKTRACE: "1"
  NODE_VERSION: "24"

jobs:
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
        if: runner.environment == 'github-hosted'
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        # `ether-desktop`'s test binaries link the Tauri app, which needs the Common Controls v6
        # manifest an installed app carries; bare, they don't start (0xc0000139). Its tests run on
        # Linux, and the Windows packaging job builds and bundles it.
        run: cargo nextest run --profile ci --workspace --all-features --exclude ether-desktop

  package:
    # The release's desktop packaging path, before merge: tauri.conf.json's beforeBuildCommand
    # (UI + helpers + MCP server staged by build-sandbox-helper.mjs --bundle), the release
    # config overlay (tauri-config.mjs: version, Windows `externalBin`), the bundler, and
    # collect.mjs's checks that the helpers are inside the package. Open-source build only
    # (the official one is the full product, built from the private repository); unsigned. Release builds use LTO and one
    # codegen unit; here only the packaging is under test, so both are off to keep it fast.
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows nsis
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
        if: runner.environment == 'github-hosted'
      - name: Windows (aws-lc-sys without NASM)
        shell: bash
        run: echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
      - name: Toolchain (from rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          key: package-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Release config overlay
        shell: bash
        run: node scripts/release/tauri-config.mjs "$RUNNER_TEMP/tauri.release.json"
      - name: tauri build
        shell: bash
        working-directory: apps/desktop
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --ci --features full --target "$TARGET" --bundles "$BUNDLES" --config "$RUNNER_TEMP/tauri.release.json"
      - name: Collect (checks the helpers are packaged)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/release/collect.mjs desktop "$TARGET" "$RUNNER_TEMP/out"
