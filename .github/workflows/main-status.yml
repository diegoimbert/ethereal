name: Main status

# The green/red signal of `main`: after a push run of CI, CI (Windows), Full product or Full product
# (macOS, Windows) finishes, report the latest *finished* push run of each on the one open
# `ci-main` issue (scripts/ci/main-status.mjs): a comment per red run, and the issue closes itself
# once every workflow's latest finished run is green. A cancelled run (skipped by the main concurrency group, or superseded by main-supersede.yml)
# is no signal: it never opens, comments on or closes the issue.
#
# Safety: `workflow_run` runs this file from the default branch with a write token; it checks out
# `main` (never the triggering run's code) and reads run metadata only.
on:
  workflow_run:
    workflows: [CI, CI (Windows), Full product, Full product (macOS, Windows)]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One report at a time (two could open two issues); the newest waiting one reads the latest state.
  group: main-status
  cancel-in-progress: false

jobs:
  report:
    name: Report
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci/main-status.mjs
