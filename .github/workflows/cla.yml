name: CLA

# Records contributor CLA signatures and gates pull requests on them. Self-contained: it needs
# no third-party app and no personal access token. Signatures are committed to the
# `cla-signatures` branch with the workflow's own token, and a `CLA` commit status is reported
# on the pull request head. Make that status a required check on the default branch so a pull
# request cannot merge until it is green (see CLA.md "For maintainers").
#
# It never checks out or runs pull-request code: both triggers check out the base/default
# branch, so a pull request from a fork cannot change what runs here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Serialize runs: two contributors signing at once must not race the signatures file.
concurrency:
  group: cla-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # commit signatures to the cla-signatures branch
      pull-requests: write # comment on the pull request
      statuses: write      # report the CLA status
    env:
      # Not exported automatically to a shell step; the script needs it for the API.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Bump when CLA.md changes materially; older signatures then have to sign again.
      CLA_VERSION: "1"
      # Accounts that never sign (the copyright holder; bots are skipped automatically).
      CLA_ALLOWLIST: "diegoimbert"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check or record the CLA
        run: node .github/scripts/cla.mjs
