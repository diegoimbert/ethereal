# cargo-nextest (CI runs `cargo nextest run --profile ci`; plain `cargo test` works too).
# Every test runs in its own process, so a test that hangs or crashes cannot take its
# neighbours with it, and the slow-timeout below turns a hang into a failure.

[profile.ci]
# Report every failure, not only the first.
fail-fast = false
# One retry: real-time tests (MIDI timing, recording compensation) can miss on a stalled shared
# runner. A test that passes only on its retry is reported as FLAKY in the log: fix it.
retries = 1
# Flag a test after 60 s, kill it after 5 min (the slowest test takes under a minute).
slow-timeout = { period = "60s", terminate-after = 5 }
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"

# Timing tests that count late callbacks of the `null` backend's audio thread (normal priority,
# like any test thread): with the rest of the suite running beside them on a 4-vCPU hosted
# runner, neighbours' threads preempt it for longer than a 5 ms buffer, which says nothing about
# the engine. They take every test slot, so they run alone (seconds each).
[[profile.ci.overrides]]
filter = 'binary_id(ether-native::it) & test(/^project_load_xruns::/)'
threads-required = 'num-test-threads'
