[package]
name = "ether-desktop"
description = "Ethereal desktop app: thin Tauri v2 shell over ether-native."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "ether-desktop"

[lib]
name = "ether_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ether-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ether-core.workspace = true
ether-native.workspace = true
ether-server.workspace = true
assert_no_alloc.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `path_drop`: forward Finder drops (file paths) to the UI.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

[lints]
workspace = true
