[package]
name = "ether-desktop"
build = "build.rs"
description = "Ethereal desktop app: thin Tauri v2 shell over ether-native."
default-run = "ether-desktop"

[package.edition]
workspace = true

[package.version]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[package.rust-version]
workspace = true

[package.publish]
workspace = true

[dependencies.assert_no_alloc]
workspace = true

[dependencies.ether-core]
workspace = true

[dependencies.ether-native]
workspace = true

[dependencies.ether-server]
workspace = true
optional = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tauri]
workspace = true

[dependencies.tauri-plugin-dialog]
workspace = true

[dependencies.tauri-plugin-fs]
workspace = true

[dependencies.tauri-plugin-http]
workspace = true
features = ["rustls-tls", "http2", "system-proxy", "unsafe-headers"]

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dev-dependencies.tauri]
workspace = true
features = ["test"]

[build-dependencies.tauri-build]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]

[target.'cfg(target_os = "macos")'.build-dependencies]

[features]
default = []
full = ["mcp", "ether-native/full"]
mcp = ["dep:ether-server"]
plugins = ["ether-native/plugins"]
warp-complex = ["ether-native/warp-complex"]

[[bin]]
path = "src/main.rs"
name = "ether-desktop"
required-features = []

[lib]
path = "src/lib.rs"
name = "ether_desktop_lib"
required-features = []
crate-type = ["staticlib", "cdylib", "rlib"]
