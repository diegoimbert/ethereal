<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ethereal</title>
    <!-- Icons: generated from assets/brand (assets/brand/README.md). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16181e" />
    <!-- The theme's background (--eth-color-bg) before the app's CSS loads: no white flash. -->
    <style>
      html { background: #16181e; }
    </style>
    <script>
      try { if (localStorage.getItem("eth-theme") === "light") document.documentElement.style.background = "#eceef2"; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
